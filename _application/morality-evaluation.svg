<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="A true rule meets a real case"><defs><marker id="next" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#b87b48"/></marker></defs><rect width="1200" height="800" rx="20" fill="#f4efdf"/><path d="M45 70h70" stroke="#b87b48" stroke-width="6"/><text x="140" y="79" fill="#52645c" font-size="23" font-weight="600" font-family="system-ui,sans-serif"><tspan x="140" dy="0">MORALITY, BETWEEN US</tspan></text><text x="60" y="163" fill="#283c3b" font-size="48" font-weight="650" font-family="system-ui,sans-serif"><tspan x="60" dy="0">A true rule meets a real case</tspan></text><text x="60" y="232" fill="#52645c" font-size="27" font-weight="400" font-family="system-ui,sans-serif"><tspan x="60" dy="0">Grant the rule. A verdict still needs people.</tspan></text><rect x="40" y="340" width="263" height="270" rx="16" fill="#e2ead9" stroke="#8c9a7e" stroke-width="2"/><circle cx="71" cy="382" r="16" fill="#b87b48"/><text x="65" y="388" fill="#fffdf5" font-size="18" font-weight="700" font-family="system-ui,sans-serif"><tspan x="65" dy="0">1</tspan></text><text x="64" y="438" fill="#283c3b" font-size="27" font-weight="700" font-family="system-ui,sans-serif"><tspan x="64" dy="0">Name it</tspan></text><text x="64" y="485" fill="#52645c" font-size="21" font-weight="400" font-family="system-ui,sans-serif"><tspan x="64" dy="0">Is a surprise party a</tspan><tspan x="64" dy="28.35">lie?</tspan></text><rect x="325" y="340" width="263" height="270" rx="16" fill="#f2e5c8" stroke="#8c9a7e" stroke-width="2"/><circle cx="356" cy="382" r="16" fill="#b87b48"/><text x="350" y="388" fill="#fffdf5" font-size="18" font-weight="700" font-family="system-ui,sans-serif"><tspan x="350" dy="0">2</tspan></text><text x="349" y="438" fill="#283c3b" font-size="27" font-weight="700" font-family="system-ui,sans-serif"><tspan x="349" dy="0">Weigh it</tspan></text><text x="349" y="485" fill="#52645c" font-size="21" font-weight="400" font-family="system-ui,sans-serif"><tspan x="349" dy="0">What if the truth gets</tspan><tspan x="349" dy="28.35">someone hurt?</tspan></text><rect x="610" y="340" width="263" height="270" rx="16" fill="#dce9e6" stroke="#8c9a7e" stroke-width="2"/><circle cx="641" cy="382" r="16" fill="#b87b48"/><text x="635" y="388" fill="#fffdf5" font-size="18" font-weight="700" font-family="system-ui,sans-serif"><tspan x="635" dy="0">3</tspan></text><text x="634" y="438" fill="#283c3b" font-size="27" font-weight="700" font-family="system-ui,sans-serif"><tspan x="634" dy="0">Find out</tspan></text><text x="634" y="485" fill="#52645c" font-size="21" font-weight="400" font-family="system-ui,sans-serif"><tspan x="634" dy="0">Is she really in</tspan><tspan x="634" dy="28.35">danger?</tspan></text><rect x="895" y="340" width="263" height="270" rx="16" fill="#e8dfed" stroke="#8c9a7e" stroke-width="2"/><circle cx="926" cy="382" r="16" fill="#b87b48"/><text x="920" y="388" fill="#fffdf5" font-size="18" font-weight="700" font-family="system-ui,sans-serif"><tspan x="920" dy="0">4</tspan></text><text x="919" y="438" fill="#283c3b" font-size="27" font-weight="700" font-family="system-ui,sans-serif"><tspan x="919" dy="0">Judge what?</tspan></text><text x="919" y="485" fill="#52645c" font-size="21" font-weight="400" font-family="system-ui,sans-serif"><tspan x="919" dy="0">The act, the person, or</tspan><tspan x="919" dy="28.35">how it turned out?</tspan></text><path d="M 305 475 H 320" fill="none" stroke="#b87b48" stroke-width="4" marker-end="url(#next)"/><path d="M 590 475 H 605" fill="none" stroke="#b87b48" stroke-width="4" marker-end="url(#next)"/><path d="M 875 475 H 890" fill="none" stroke="#b87b48" stroke-width="4" marker-end="url(#next)"/><path d="M80 650h1040" stroke="#8c9a7e"/><text x="60" y="699" fill="#283c3b" font-size="24" font-weight="600" font-family="system-ui,sans-serif"><tspan x="60" dy="0">Even a universal moral rule has to be named, weighed and applied by people before</tspan><tspan x="60" dy="32.400000000000006">it gives a verdict.</tspan></text><text x="60" y="765" fill="#52645c" font-size="17" font-weight="400" font-family="system-ui,sans-serif"><tspan x="60" dy="0">AUTHORED DIAGRAM · NO MEASURED QUANTITIES</tspan></text></svg>
