<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Can facts tell us what to do?"><rect width="1200" height="800" rx="20" fill="#172c35"/><path d="M45 70h70" stroke="#85c9b6" stroke-width="6"/><text x="140" y="79" fill="#85c9b6" font-size="23" font-weight="600" font-family="system-ui,sans-serif"><tspan x="140" dy="0">MORALITY, BETWEEN US</tspan></text><text x="60" y="163" fill="#fffaf0" font-size="48" font-weight="600" font-family="system-ui,sans-serif"><tspan x="60" dy="0">Can facts tell us what to do?</tspan></text><text x="60" y="255" fill="#c3d4d9" font-size="27" font-weight="400" font-family="system-ui,sans-serif"><tspan x="60" dy="0">Every argument from “is” to “ought” carries a value across.</tspan></text><rect x="60" y="350" width="345" height="250" rx="15" fill="#284651" stroke="#718b91"/><circle cx="92" cy="389" r="15" fill="#85c9b6"/><text x="86" y="395" fill="#172c35" font-size="18" font-weight="700" font-family="system-ui,sans-serif"><tspan x="86" dy="0">1</tspan></text><text x="84" y="448" fill="#fffaf0" font-size="29" font-weight="600" font-family="system-ui,sans-serif"><tspan x="84" dy="0">The fact</tspan></text><text x="84" y="510" fill="#d5e1e4" font-size="23" font-weight="400" font-family="system-ui,sans-serif"><tspan x="84" dy="0">Smoking shortens lives</tspan></text><rect x="425" y="350" width="345" height="250" rx="15" fill="#344a55" stroke="#718b91"/><circle cx="457" cy="389" r="15" fill="#85c9b6"/><text x="451" y="395" fill="#172c35" font-size="18" font-weight="700" font-family="system-ui,sans-serif"><tspan x="451" dy="0">2</tspan></text><text x="449" y="448" fill="#fffaf0" font-size="29" font-weight="600" font-family="system-ui,sans-serif"><tspan x="449" dy="0">The hidden premise</tspan></text><text x="449" y="510" fill="#d5e1e4" font-size="23" font-weight="400" font-family="system-ui,sans-serif"><tspan x="449" dy="0">I want a longer life</tspan></text><rect x="790" y="350" width="345" height="250" rx="15" fill="#3b4e51" stroke="#718b91"/><circle cx="822" cy="389" r="15" fill="#85c9b6"/><text x="816" y="395" fill="#172c35" font-size="18" font-weight="700" font-family="system-ui,sans-serif"><tspan x="816" dy="0">3</tspan></text><text x="814" y="448" fill="#fffaf0" font-size="29" font-weight="600" font-family="system-ui,sans-serif"><tspan x="814" dy="0">The conclusion</tspan></text><text x="814" y="510" fill="#d5e1e4" font-size="23" font-weight="400" font-family="system-ui,sans-serif"><tspan x="814" dy="0">So I should stop</tspan></text><path d="M80 632h1040" stroke="#70898c"/><text x="60" y="688" fill="#b4ded0" font-size="28" font-weight="400" font-family="system-ui,sans-serif"><tspan x="60" dy="0">The gap rules out reading morality off the world. On its own, it does not</tspan><tspan x="60" dy="37.800000000000004">rule out objective values.</tspan></text><text x="60" y="765" fill="#8ea6ac" font-size="17" font-weight="400" font-family="system-ui,sans-serif"><tspan x="60" dy="0">AUTHORED DIAGRAM · NO MEASURED QUANTITIES</tspan></text></svg>
